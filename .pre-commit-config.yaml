# Install the reviewed local tooling first; hooks never acquire dependencies.
# The Makefile shares these checks with CI and keeps formatting checks scoped
# to the newly approved helper and its tests. No hook rewrites source files.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.5.1"
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: locked-dependencies
        name: Verify the dependency lock offline
        entry: make lock-check
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: scoped-python-quality
        name: Check scoped Python lint and formatting
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: project-secret-scan
        name: Scan the approved project files for possible secrets
        entry: make secret-scan
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
