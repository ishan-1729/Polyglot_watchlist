name: Follow the Money offline checks
"on":
  pull_request:
    paths: ["src/follow_the_money/**", "tests/follow_the_money/**", "config/follow_the_money/**", "pyproject.toml", "uv.lock", ".github/workflows/follow-the-money.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ftm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LANGSMITH_TRACING: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      # Same verified action pins as the repository's existing offline workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked optional dependencies
        run: uv sync --locked --dev --extra ftm --extra ftm-ml --extra ftm-m365 --group qa
      - name: Offline deterministic tests (external sockets denied by fixture)
        run: uv run --no-sync pytest -q tests/follow_the_money -p no:cacheprovider
      - name: Lint and format
        run: |
          uv run --no-sync ruff check src/follow_the_money tests/follow_the_money scripts/ftm_*.py
          uv run --no-sync ruff format --check src/follow_the_money tests/follow_the_money scripts/ftm_*.py
